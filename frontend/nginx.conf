# Шлюз: отдаёт собранный фронтенд и проксирует API микросервисов с одного адреса
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/auth/login -> auth-service /api/login
    location /api/auth/ {
        proxy_pass http://auth-service:8000/api/;
    }

    # /api/data/Upload_file -> timescale-service /Upload_file
    location /api/data/ {
        proxy_pass http://timescale-service:8000/;
    }

    # SPA: все остальные пути отдают index.html (маршрутизация на стороне React)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
