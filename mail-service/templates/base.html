<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <title>{% block title %}{{ app_name | e }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f4">

  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#eef1f4">
    {% block preheader %}{% endblock %}
  </div>

  <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" bgcolor="#eef1f4">
    <tr>
      <td align="center" style="padding:40px 16px">

        <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation"
               bgcolor="#ffffff"
               style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #d9dfe5">

          <tr>
            <td height="6" bgcolor="#0b7a83"
                style="height:6px;line-height:6px;font-size:0;background-color:#0b7a83;border-radius:12px 12px 0 0">&nbsp;</td>
          </tr>

          <tr>
            <td align="left" style="padding:28px 40px 8px 40px;font-family:Arial,Helvetica,sans-serif">
              {% if logo_url %}
              <img src="{{ logo_url | e }}" alt="{{ app_name | e }}" width="64"
                   style="display:block;width:64px;height:auto;border:0"/>
              {% else %}
              <span style="font-size:15px;line-height:20px;font-weight:bold;color:#0b7a83">{{ app_name | e }}</span>
              {% endif %}
            </td>
          </tr>

          {% block content %}{% endblock %}

        </table>

        <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px">
          <tr>
            <td align="center"
                style="padding:20px 16px 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8a96a3">
              Это автоматическое письмо, отвечать на него не нужно.<br/>
              © {{ app_name | e }}
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
